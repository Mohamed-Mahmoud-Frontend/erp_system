name: Quality checks
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      NEXT_PUBLIC_SITE_URL: https://example.com
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Check immutable migration history
        run: npm run db:check
        env:
          MIGRATIONS_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      - run: node scripts/deploy/verify-migrations.mjs
      - run: npx eslint . --max-warnings=0
      - run: npm run verify:business
      - run: npm run verify:permissions
      - run: npm run build
      - run: npm run typecheck
