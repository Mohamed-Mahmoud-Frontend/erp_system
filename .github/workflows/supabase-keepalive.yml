name: Supabase keepalive

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: supabase-keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Read database through PostgREST
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$SUPABASE_URL" || -z "$SUPABASE_KEY" ]]; then
            echo '::error::Set NEXT_PUBLIC_SUPABASE_URL and NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY in repository Actions secrets.'
            exit 1
          fi
          curl --fail --silent --show-error \
            --retry 3 --retry-delay 10 --retry-all-errors \
            --connect-timeout 15 --max-time 45 \
            --header "apikey: $SUPABASE_KEY" \
            --output /dev/null \
            "${SUPABASE_URL%/}/rest/v1/user_access?select=user_id&limit=1"
          echo 'Supabase database request succeeded.'
